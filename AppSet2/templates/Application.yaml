apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
    argocd.argoproj.io/sync-wave: "-500" # Created first, destroyed last
  finalizers:
    # https://argo-cd.readthedocs.io/en/latest/user-guide/app_deletion/#about-the-deletion-finalizer
    - resources-finalizer.argocd.argoproj.io
spec:
  project: argocd
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
  source:
    repoURL: https://github.com/kristoferlundgren/my-appset
    targetRevision: main
    path: AppSet
    helm:
      releaseName: my-infra
      valuesObject: # All values.yaml variables.
{{ .Values | toYaml | indent 8}}
