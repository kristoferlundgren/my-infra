metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  source:
    chart: kyverno
    repoURL: https://kyverno.github.io/kyverno/
    # https://artifacthub.io/packages/helm/kyverno/kyverno
    targetRevision: 3.8.1
    helm:
      valuesObject:
        config:
          # https://main.kyverno.io/docs/installation/platform-notes/#configuration-best-practices
          preserve: false
        crds:
          install: true
        features:
          policyExceptions:
            enabled: true
            namespace: kyverno
        grafana:
          enabled: true
          grafanaDashboard:
            create: true
        admissionController:
          crdWatcher: true
          replicas: 1 # Single-node cluster; use 3 replicas for HA.
        backgroundController:
          replicas: 1 # Single-node cluster; use 2 replicas for HA.
          rbac:
            clusterRole:
              extraResources:
                - apiGroups:
                    - ""
                  resources:
                    - namespaces
                  verbs:
                    - get
                    - list
                    - watch
                    - patch
                    - update
        cleanupController:
          replicas: 1 # Single-node cluster; use 2 replicas for HA.
        reportsController:
          replicas: 1 # Single-node cluster; use 2 replicas for HA.
