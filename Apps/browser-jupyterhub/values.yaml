proxy:
  service:
    type: ClusterIP
  https:
    enabled: false
  chp:
    networkPolicy:
      enabled: false

ingress:
  enabled: false

hub:
  allowNamedServers: true
  namedServerLimitPerUser: 0
  redirectToServer: true
  command:
    - /bin/sh
    - -c
  args:
    - python3 -m pip install --user --no-cache-dir jupyterhub-tmpauthenticator==1.0.0 && exec jupyterhub --config /usr/local/etc/jupyterhub/jupyterhub_config.py --upgrade-db
  config:
    JupyterHub:
      authenticator_class: tmp
  db:
    type: sqlite-pvc
    pvc:
      storage: 1Gi
  extraConfig:
    browser.py: |
      import uuid

      from jupyterhub.handlers.base import BaseHandler
      from tornado import web
      from tornado.escape import url_escape

      c.Authenticator.allow_all = True
      c.KubeSpawner.port = 3000
      c.KubeSpawner.http_timeout = 120

      BROWSER_TARGETS = {
          "argocd": {
              "title": "Argo CD Browser",
              "target_url": "https://argocd-server.argocd.svc.cluster.local/",
              "chrome_cli": "--kiosk https://argocd-server.argocd.svc.cluster.local/ --ignore-certificate-errors-spki-list=VMWLgWVQrm8Db9dpFwDBpojkjaYnAfG3zONhiCCItPs= --no-first-run --no-default-browser-check --disable-dev-shm-usage --disable-session-crashed-bubble --disable-features=Translate,PasswordManagerOnboarding",
          },
          "headlamp": {
              "title": "Headlamp Browser",
              "target_url": "http://headlamp.headlamp.svc.cluster.local/",
              "chrome_cli": "--kiosk http://headlamp.headlamp.svc.cluster.local/ --no-first-run --no-default-browser-check --disable-dev-shm-usage --disable-session-crashed-bubble --disable-features=Translate,PasswordManagerOnboarding",
          },
      }

      BROWSER_BASE_ENVIRONMENT = {
          "PUID": "1000",
          "PGID": "1000",
          "TZ": "Europe/Stockholm",
          "CUSTOM_PORT": "3000",
          "HARDEN_DESKTOP": "true",
          "HARDEN_OPENBOX": "true",
          "NO_DECOR": "true",
          "NO_FULL": "false",
          "PIXELFLUX_WAYLAND": "false",
          "RESTART_APP": "true",
          "SELKIES_AUDIO_ENABLED": "false|locked",
          "SELKIES_CLIPBOARD_ENABLED": "true|locked",
          "SELKIES_COMMAND_ENABLED": "false|locked",
          "SELKIES_ENABLE_COLLAB": "false|locked",
          "SELKIES_ENABLE_PLAYER2": "false|locked",
          "SELKIES_ENABLE_PLAYER3": "false|locked",
          "SELKIES_ENABLE_PLAYER4": "false|locked",
          "SELKIES_ENABLE_SHARED": "false|locked",
          "SELKIES_ENABLE_SHARING": "false|locked",
          "SELKIES_FILE_TRANSFERS": "",
          "SELKIES_GAMEPAD_ENABLED": "false|locked",
          "SELKIES_MICROPHONE_ENABLED": "false|locked",
          "SELKIES_UI_SHOW_LOGO": "false|locked",
          "SELKIES_UI_SHOW_SIDEBAR": "true|locked",
          "SELKIES_UI_SIDEBAR_SHOW_APPS": "false|locked",
          "SELKIES_UI_SIDEBAR_SHOW_CLIPBOARD": "true|locked",
          "SELKIES_UI_SIDEBAR_SHOW_FILES": "false|locked",
          "SELKIES_UI_SIDEBAR_SHOW_FULLSCREEN": "false|locked",
          "SELKIES_UI_SIDEBAR_SHOW_GAMEPADS": "false|locked",
          "SELKIES_UI_SIDEBAR_SHOW_SHARING": "false|locked",
          "SELKIES_UI_SIDEBAR_SHOW_SOFT_BUTTONS": "false|locked",
          "SUBFOLDER": "$(JUPYTERHUB_SERVICE_PREFIX)",
      }

      def browser_target_from_server_name(server_name):
          for target in BROWSER_TARGETS:
              if server_name.startswith(f"{target}-"):
                  return target
          return None

      async def configure_browser_target(spawner):
          target = browser_target_from_server_name(spawner.name)
          if target is None:
              raise ValueError(f"Unknown browser target for named server {spawner.name!r}")

          target_config = BROWSER_TARGETS[target]
          environment = BROWSER_BASE_ENVIRONMENT.copy()
          environment["CHROME_CLI"] = target_config["chrome_cli"]
          environment["TITLE"] = target_config["title"]
          spawner.environment = environment

          labels = dict(getattr(spawner, "extra_labels", {}) or {})
          labels["browser-target"] = target
          spawner.extra_labels = labels

          annotations = dict(getattr(spawner, "extra_annotations", {}) or {})
          annotations["browser-target-url"] = target_config["target_url"]
          spawner.extra_annotations = annotations

      c.KubeSpawner.environment = BROWSER_BASE_ENVIRONMENT.copy()
      c.Spawner.pre_spawn_hook = configure_browser_target

      class BrowserTargetHandler(BaseHandler):
          @web.authenticated
          async def get(self, target):
              if target not in BROWSER_TARGETS:
                  raise web.HTTPError(404, f"Unknown browser target: {target}")

              server_name = f"{target}-{uuid.uuid4().hex}"
              username = self.current_user.name
              self.redirect(f"/hub/spawn/{url_escape(username)}/{url_escape(server_name)}")

      c.JupyterHub.extra_handlers = [
          (r"/browser/([^/]+)", BrowserTargetHandler),
      ]
  networkPolicy:
    enabled: false

singleuser:
  image:
    name: lscr.io/linuxserver/chromium
    tag: latest
    pullPolicy: IfNotPresent
  extraFiles:
    chromium-browser-policy:
      mountPath: /etc/chromium/policies/managed/browser.json
      data:
        PasswordManagerEnabled: false
        AutofillAddressEnabled: false
        AutofillCreditCardEnabled: false
  cmd: null
  defaultUrl: /
  uid: 0
  fsGid: 0
  allowPrivilegeEscalation: true
  cloudMetadata:
    blockWithIptables: false
  storage:
    type: none
    extraVolumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
    extraVolumeMounts:
      - name: dshm
        mountPath: /dev/shm
  cpu:
    guarantee: 0.25
    limit: 2
  memory:
    guarantee: 1G
    limit: 4G
  networkPolicy:
    enabled: false

cull:
  enabled: true
  timeout: 1800
  every: 300
  users: true
  removeNamedServers: true

prePuller:
  hook:
    enabled: false
  continuous:
    enabled: false

scheduling:
  userScheduler:
    enabled: false
  userPlaceholder:
    enabled: false
