apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser
  labels:
    app.kubernetes.io/name: browser
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: browser
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: browser
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      initContainers:
        - name: generate-tls
          image: alpine/openssl:3.5.0
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              cat > /tmp/openssl.cnf <<'EOF'
              [req]
              distinguished_name = req_distinguished_name
              x509_extensions = v3_req
              prompt = no

              [req_distinguished_name]
              CN = {{ .Values.browser.tls.commonName }}

              [v3_req]
              keyUsage = keyEncipherment, dataEncipherment
              extendedKeyUsage = serverAuth
              subjectAltName = @alt_names

              [alt_names]
              {{- range $index, $name := .Values.browser.tls.dnsNames }}
              DNS.{{ add $index 1 }} = {{ $name }}
              {{- end }}
              EOF
              openssl req -x509 -nodes -days 3650 -newkey rsa:2048 -keyout /tls/tls.key -out /tls/tls.crt -config /tmp/openssl.cnf
          volumeMounts:
            - name: tls
              mountPath: /tls
      containers:
        - name: nginx
          image: {{ printf "%s:%s" .Values.browser.image.repository .Values.browser.image.tag | quote }}
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: tls
              mountPath: /etc/browser-tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: browser-nginx
        - name: tls
          emptyDir: {}
