apiVersion: v1
kind: Service
metadata:
  name: browser
  labels:
    app.kubernetes.io/name: browser
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: browser
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
