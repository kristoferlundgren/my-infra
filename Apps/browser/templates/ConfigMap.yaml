apiVersion: v1
kind: ConfigMap
metadata:
  name: browser-nginx
  labels:
    app.kubernetes.io/name: browser
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Browser Sessions</title>
      <style>
        :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080b12; color: #eef3ff; }
        main { width: min(760px, calc(100vw - 40px)); }
        h1 { margin: 0 0 10px; font-size: clamp(2rem, 6vw, 4rem); letter-spacing: -0.06em; }
        p { color: #aab6ca; line-height: 1.6; }
        .grid { display: grid; gap: 14px; margin-top: 28px; }
        a { display: block; padding: 18px 20px; border: 1px solid #253149; border-radius: 18px; color: inherit; text-decoration: none; background: linear-gradient(135deg, #111827, #0d1320); }
        a:hover { border-color: #6ea8ff; background: linear-gradient(135deg, #162033, #111827); }
        strong { display: block; font-size: 1.2rem; margin-bottom: 4px; }
        span { color: #9ba8bd; }
      </style>
    </head>
    <body>
      <main>
        <h1>Browser Sessions</h1>
        <p>Choose a target. Each click starts a fresh isolated Kubernetes browser pod. Idle sessions are culled automatically.</p>
        <div class="grid">
          {{- range .Values.browser.endpoints }}
          <a href="/{{ .path }}">
            <strong>{{ .title }}</strong>
            <span>{{ .description }}</span>
          </a>
          {{- end }}
        </div>
      </main>
    </body>
    </html>
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    server {
      listen 80;
      server_name _;
      return 308 https://$host$request_uri;
    }

    server {
      listen 443 ssl;
      http2 on;
      server_name _;

      ssl_certificate /etc/browser-tls/tls.crt;
      ssl_certificate_key /etc/browser-tls/tls.key;

      location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
      }

      {{- range .Values.browser.endpoints }}
      location = /{{ .path }} {
        return 302 /hub/browser/{{ .path }};
      }

      location = /{{ .path }}/ {
        return 302 /hub/browser/{{ .path }};
      }
      {{- end }}

      location / {
        proxy_pass http://{{ .Values.browser.upstream }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
      }
    }
