browser:
  upstream: proxy-public.browser-jupyterhub.svc.cluster.local
  image:
    repository: nginx
    tag: 1.27-alpine
  endpoints:
    - path: argocd
      title: Argo CD
      description: Open an isolated browser session for Argo CD.
    - path: headlamp
      title: Headlamp
      description: Open an isolated browser session for Headlamp.
    - path: svt
      title: SVT
      description: Open an isolated browser session for SVT.
  tls:
    commonName: browser.browser.svc.cluster.local
    dnsNames:
      - browser.browser.svc.cluster.local
      - browser.browser
      - browser
