apiVersion: v1
kind: ServiceAccount
metadata:
  name: zitadel-terraform
  namespace: zitadel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zitadel-terraform-headlamp-oidc
  namespace: {{ .Values.headlamp.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zitadel-terraform-headlamp-oidc
  namespace: {{ .Values.headlamp.namespace }}
subjects:
  - kind: ServiceAccount
    name: zitadel-terraform
    namespace: zitadel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zitadel-terraform-headlamp-oidc
