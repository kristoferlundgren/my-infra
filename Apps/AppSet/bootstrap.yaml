apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra.appset
  namespace: infra
spec:
  project: infra
  destination:
    namespace: infra
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
  sources:
    - path: AppSet
      repoURL: https://github.com/kristoferlundgren/my-appset
      targetRevision: main
      helm:
        releaseName: appset
        valueFiles:
          - $values/Apps/AppSet/values.yaml
        ignoreMissingValueFiles: true
    - path: Apps/AppSet/dependencies
      repoURL: https://github.com/kristoferlundgren/my-infra
      targetRevision: release/staging
    - repoURL: https://github.com/kristoferlundgren/my-infra
      targetRevision: release/staging
      ref: values
