apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
  finalizers:
    # https://argo-cd.readthedocs.io/en/latest/user-guide/app_deletion/#about-the-deletion-finalizer
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  destination:
    namespace: kyverno
    server: {{ .Values.server }}
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
      - Force=true
      - Replace=true
      - ServerSideApply=true
  source:
    chart: kyverno-policies
    repoURL: https://kyverno.github.io/kyverno/
    # https://artifacthub.io/packages/helm/kyverno-policies-oci/kyverno-policies
    # https://kyverno.io/docs/installation/methods/#install-pod-security-policies-via-helm
    # https://kyverno.io/policies/pod-security/
    # https://kubernetes.io/docs/concepts/security/pod-security-standards/
    targetRevision: 3.7.1
    helm:
      releaseName: kyverno-policies # Override ArgoCD application name
      valuesObject:
        policyKind: ClusterPolicy
        policyType: ValidatingPolicy
        podSecurityStandard: restricted
        validationFailureAction: Audit # TODO: Change to Enforce
        validationFailureActionOverrides:
          all:
            - action: audit
              namespaces:
                - kube-system
        validationFailureActionByPolicy: # (`Audit`, `Enforce`)
            disallow-capabilities-strict: Audit
            disallow-privilege-escalation: Audit
            require-run-as-nonroot: Audit
            restrict-seccomp-strict: Audit
            disallow-host-process: Enforce
            disallow-privileged-containers: Enforce
        policyExclude:
          disallow-capabilities:
            any:
              - resources:
                  kinds:
                    - Pod
                  namespaces:
                    - kube-system
          disallow-capabilities-strict:
            any:
              - resources:
                  kinds:
                    - Pod
                  namespaces:
                    - kube-system
          disallow-host-namespaces:
            any:
              - resources:
                  kinds:
                    - Pod
                  namespaces:
                    - kube-system
          disallow-host-path:
            any:
              - resources:
                  kinds:
                    - Pod
                  namespaces:
                    - kube-system
          disallow-host-ports:
            any:
              - resources:
                  kinds:
                    - Pod
                  namespaces:
                    - kube-system
          disallow-host-process:
            any:
              - resources:
                  kinds:
                    - Pod
                  namespaces:
                    - kube-system
          disallow-privilege-escalation:
            any:
              - resources:
                  kinds:
                    - Pod
                  namespaces:
                    - kube-system
          disallow-privileged-containers:
            any:
              - resources:
                  kinds:
                    - Pod
                  namespaces:
                    - kube-system
          disallow-proc-mount:
            any:
              - resources:
                  kinds:
                    - Pod
                  namespaces:
                    - kube-system
          disallow-selinux:
            any:
              - resources:
                  kinds:
                    - Pod
                  namespaces:
                    - kube-system
          require-run-as-non-root-user:
            any:
              - resources:
                  kinds:
                    - Pod
                  namespaces:
                    - kube-system
          require-run-as-nonroot:
            any:
              - resources:
                  kinds:
                    - Pod
                  namespaces:
                    - kube-system
          restrict-apparmor-profiles:
            any:
              - resources:
                  kinds:
                    - Pod
                  namespaces:
                    - kube-system
          restrict-seccomp:
            any:
              - resources:
                  kinds:
                    - Pod
                  namespaces:
                    - kube-system
          restrict-seccomp-strict:
            any:
              - resources:
                  kinds:
                    - Pod
                  namespaces:
                    - kube-system
          restrict-sysctls:
            any:
              - resources:
                  kinds:
                    - Pod
                  namespaces:
                    - kube-system
          restrict-volume-types:
            any:
              - resources:
                  kinds:
                    - Pod
                  namespaces:
                    - kube-system
